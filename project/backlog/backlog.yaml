# Backlog técnico estimado — documento maestro v0.5, sección 6.8.
# Story points relativos de Fibonacci; NO equivalen a horas. Una historia de 13 SP
# debe dividirse o tratarse como integración controlada. El backlog contiene 211 SP
# candidatos, no un compromiso: 180 SP P0 protegidos + 31 SP P1 no comprometidos
# (sección 7.3). El compromiso final se ratifica al cierre de S2 con velocidad observada.
#
# repo: mejor esfuerzo de asignación a partir de las "Primeras tareas" de cada
# repositorio; "multi" cuando la historia cruza más de un repositorio (ver ADR-014).

epics:
  E1: {name: Gobierno, objective: "Repositorios, releases, ADR, OSS y supply chain", result: "Baseline reproducible, SBOM y Scope Gate"}
  E2: {name: Datos, objective: "Schemas, fixtures, adapters y contratos", result: "Contratos v1 y producer/consumer tests"}
  E3: {name: Evaluación, objective: "Harness No-RAG, métricas y regresión", result: "AC01-AC14 automatizados y reportables"}
  E4: {name: Cyber, objective: "Cyber-range, MCP sandbox, exposición y rutas", result: "C-07 seguro, reproducible y aislado"}
  E5: {name: XDR, objective: "Telemetría, correlación, MISP y DMZ", result: "C-06/C-08 con hechos y evidencia real de laboratorio"}
  E6: {name: Respuesta, objective: "LangGraph, OPA, Shuffle, HITL y rollback", result: "Una contención reversible aprobada y verificada"}
  E7: {name: Operación, objective: "SmartOps, evidence store y SOC handover", result: "Experiencia del analista y paquete auditable"}
  E8: {name: Integración, objective: "Resiliencia, hardening, aceptación y demo", result: "ARGOS-CYB-01 completo y release candidate"}
  E9: {name: Aseguramiento, objective: "Roadmap A→L (ADR-051 en adelante) — Safety Kernel, Evidence/Trust, Semantic/Mission, Federation", result: "Trazabilidad de backlog formal para capacidad ya construida y probada, adoptada fuera del backlog original por ADR-051"}
  E10: {name: Resiliencia, objective: "Chaos Engineering & Chaos Monkey Validation Profile (Fase M, ADR-068) — fault injection real sobre el cyber-range, nunca camino productivo", result: "Safety guard fail-closed probado, catálogo CHAOS-01..20 declarado, quality gates CH-01..12"}
  E11: {name: "Detection Engineering Loop", objective: "Kafka + ARGOS Global Investigator + generación gobernada de reglas Wazuh + backtesting + SOC feedback (Fase N, ADR-069) — AI_DIRECT_RULE_DEPLOYMENT=DENY", result: "Compilador determinista WazuhRuleSpec->XML probado, gate de despliegue bloqueado por CH-07/ARG-020, investigación L0-L5 determinista, CHAOS-21..32"}

totals:
  candidate_sp: 279
  p0_sp: 180
  p1_sp: 99
  note: "P1 no entra en el compromiso inicial; regla de pull para P1 en governance/gates/gates.md. ARG-029 (E9) es trazabilidad retroactiva de capacidad ya IMPLEMENTED_LOCALLY_AND_TESTED (Fase L), no trabajo pendiente — ver architecture/implementation-readiness.md §4.1. ARG-030..032 (E10, ADR-068) es capacidad nueva de Fase M, decidida por el usuario 2026-08-18 — sí es trabajo real, parcialmente ya IMPLEMENTED_LOCALLY_AND_TESTED (safety guard) y parcialmente BLOCKED_EXTERNAL (cluster de caos real). ARG-033..036 (E11, ADR-069) introduce Kafka en paralelo a NATS JetStream — desviación explícita de ADR-002, documentada en ADR-069, no oculta."

