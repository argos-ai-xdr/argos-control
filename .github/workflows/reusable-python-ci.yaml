name: reusable-python-ci

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directorio del paquete/servicio Python
        type: string
        default: "."
      python-version:
        type: string
        default: "3.12"
      contracts-ref:
        description: >-
          Si se indica (p. ej. "main"), hace checkout de
          argos-ai-xdr/argos-contracts-scenarios y expone su ruta en
          ARGOS_CONTRACTS_PATH para repos cuyos tests validan fixtures/schemas
          contra ese repositorio hermano (p. ej. argos-validation, argos-core).
        type: string
        default: ""
      control-ref:
        description: >-
          Si se indica (p. ej. "main"), hace checkout de
          argos-ai-xdr/argos-control y expone su ruta en ARGOS_CONTROL_PATH
          para repos cuyos tests cruzan referencias contra
          project/backlog/backlog.yaml (p. ej. argos-validation, TRACE-01).
          argos-control es público (2026-08-18) por el mismo motivo que
          argos-contracts-scenarios: evita depender de un PAT cross-repo.
        type: string
        default: ""
      secrets-scan-exclude:
        description: >-
          Patrón regex adicional (además de _contracts-scenarios/ y
          .github/workflows/, ya excluidos siempre) para detect-secrets --
          para falsos positivos específicos del repo llamador que no se
          pueden silenciar con un comentario `pragma: allowlist secret`
          (p. ej. JSON, que no admite comentarios). Ejemplo real
          (argos-cyber-tools): "tool_catalog/signatures/" -- hashes de
          integridad publicados, no secretos, que el heurístico "Hex High
          Entropy String" no puede distinguir de una clave real.
        type: string
        default: ""
    secrets:
      CONTRACTS_CHECKOUT_TOKEN:
        description: >-
          PAT con acceso de lectura a argos-ai-xdr/argos-contracts-scenarios.
          Requerido cuando contracts-ref != "" porque el GITHUB_TOKEN por
          defecto solo tiene acceso al repo donde corre el workflow, no a
          repos hermanos privados. El caller debe pasar
          `secrets: inherit` (u override explícito de este secreto de org).
          Nombre en MAYÚSCULAS_CON_GUION_BAJO a propósito: los secretos reales
          de GitHub no admiten guiones ("-") en el nombre — un parámetro de
          workflow_call sí los admite, pero entonces `secrets: inherit` nunca
          podría emparejarlo con ningún secreto real (encontrado al intentar
          crear el secreto en la UI: "Secret names can only contain
          alphanumeric characters or underscores").
        required: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout argos-contracts-scenarios (repo hermano)
        if: inputs.contracts-ref != ''
        uses: actions/checkout@v4
        with:
          repository: argos-ai-xdr/argos-contracts-scenarios
          ref: ${{ inputs.contracts-ref }}
          path: _contracts-scenarios
          # 2026-08-18: argos-contracts-scenarios pasó a público -- ya no
          # requiere CONTRACTS_CHECKOUT_TOKEN para el checkout en sí
          # (repos públicos se clonan con el github.token por defecto).
          # `||` conserva el secreto como override real si el repo
          # volviera a ser privado: un secreto vacío (no configurado)
          # hace que actions/checkout falle con "Input required and not
          # supplied: token" si se le pasa "" explícito -- core.getInput
          # con required:true trata la cadena vacía igual que "no
          # suministrado", así que sin este fallback un secreto ausente
          # rompe el checkout aunque el repo sea público.
          token: ${{ secrets.CONTRACTS_CHECKOUT_TOKEN || github.token }}

      - name: Checkout argos-control (repo hermano)
        if: inputs.control-ref != ''
        uses: actions/checkout@v4
        with:
          repository: argos-ai-xdr/argos-control
          ref: ${{ inputs.control-ref }}
          path: _control
          # argos-control es público -- mismo razonamiento que el checkout
          # de argos-contracts-scenarios de arriba (fallback por si algún
          # día vuelve a ser privado).
          token: ${{ secrets.CONTROL_CHECKOUT_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # editable_mode=compat (2026-08-18, run real): el modo "strict"
          # por defecto de pip/setuptools recientes genera un finder con
          # mapeo estático nombre->fichero para instalaciones editable con
          # varios paquetes de nivel superior (packages.find con include
          # de varios patrones) -- en argos-cyber-tools esto producía
          # "ImportError: cannot import name X from 'graph' (unknown
          # location)" SOLO para el paquete `graph` en sí (sus submódulos
          # importaban bien por separado), no reproducible en local.
          # compat vuelve al mecanismo simple (.pth, todo el árbol en
          # sys.path), documentado como solución para exactamente esta
          # clase de problema.
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" --config-settings editable_mode=compat; fi

      - name: Lint (ruff)
        # _contracts-scenarios/ (si existe -- contracts-ref != '') es un
        # checkout hermano DENTRO del workspace solo para que los tests
        # resuelvan ARGOS_CONTRACTS_PATH -- no es código de este
        # repositorio y no debe lintarse (encontrado 2026-08-18 en un run
        # real: ruff reportaba EXE001 sobre
        # _contracts-scenarios/validators/validate_fixtures.py).
        run: ruff check . --exclude _contracts-scenarios --exclude _control

      - name: Type check (mypy)
        run: mypy . --exclude '^_contracts-scenarios/' --exclude '^_control/' || true # elevar a bloqueante cuando el repo declare tipado estricto

      - name: Tests (pytest, con cobertura)
        env:
          ARGOS_CONTRACTS_PATH: ${{ inputs.contracts-ref != '' && format('{0}/_contracts-scenarios', github.workspace) || '' }}
          ARGOS_CONTROL_PATH: ${{ inputs.control-ref != '' && format('{0}/_control', github.workspace) || '' }}
        run: pytest --cov --cov-report=term-missing

      - name: Bloquear secretos filtrados
        run: |
          pip install detect-secrets
          # Exclusiones fijas, encontradas ejecutando runs reales (2026-08-18):
          # - .git/: --all-files desactiva el filtrado por .gitignore de
          #   detect-secrets (que normalmente ya excluiría .git/) -- sin
          #   esto, escanea objetos internos de git; .git/FETCH_HEAD
          #   contiene un SHA de commit (40 hex) que "Hex High Entropy
          #   String" marca como secreto en CUALQUIER repo, causa raíz
          #   real de este fallo, no específica de argos-core.
          # - _contracts-scenarios/: checkout hermano, no es código de este repo.
          # - .github/workflows/: solo referencia NOMBRES de secretos
          #   (${{ secrets.X }}), nunca valores -- "Secret Keyword" falso-
          #   positiveaba sobre "secrets: inherit".
          # - .{mypy,pytest,ruff}_cache/: gitignored, pero YA EXISTEN en este
          #   punto del job (los pasos Lint/Type check/Tests, arriba en este
          #   mismo workflow, los crean) -- detect-secrets escanea el árbol
          #   real, no lo que está en git, así que "Hex High Entropy String"
          #   sobre CACHEDIR.TAG apareció en un run real aunque el archivo
          #   nunca se comitea.
          ARGS=(scan --all-files
            --exclude-files '\.git/'
            --exclude-files '_contracts-scenarios/'
            --exclude-files '_control/'
            --exclude-files '\.github/workflows/'
            --exclude-files '\.(mypy|pytest|ruff)_cache/'
          )
          EXTRA_EXCLUDE="${{ inputs.secrets-scan-exclude }}"
          if [ -n "$EXTRA_EXCLUDE" ]; then
            ARGS+=(--exclude-files "$EXTRA_EXCLUDE")
          fi
          detect-secrets "${ARGS[@]}" > /tmp/secrets-scan.json
          python -c "import json,sys; d=json.load(open('/tmp/secrets-scan.json')); print(json.dumps(d['results'], indent=2)); sys.exit(1 if d['results'] else 0)"
