name: reusable-python-ci

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directorio del paquete/servicio Python
        type: string
        default: "."
      python-version:
        type: string
        default: "3.12"
      contracts-ref:
        description: >-
          Si se indica (p. ej. "main"), hace checkout de
          argos-ai-xdr/argos-contracts-scenarios y expone su ruta en
          ARGOS_CONTRACTS_PATH para repos cuyos tests validan fixtures/schemas
          contra ese repositorio hermano (p. ej. argos-validation, argos-core).
        type: string
        default: ""
    secrets:
      CONTRACTS_CHECKOUT_TOKEN:
        description: >-
          PAT con acceso de lectura a argos-ai-xdr/argos-contracts-scenarios.
          Requerido cuando contracts-ref != "" porque el GITHUB_TOKEN por
          defecto solo tiene acceso al repo donde corre el workflow, no a
          repos hermanos privados. El caller debe pasar
          `secrets: inherit` (u override explícito de este secreto de org).
          Nombre en MAYÚSCULAS_CON_GUION_BAJO a propósito: los secretos reales
          de GitHub no admiten guiones ("-") en el nombre — un parámetro de
          workflow_call sí los admite, pero entonces `secrets: inherit` nunca
          podría emparejarlo con ningún secreto real (encontrado al intentar
          crear el secreto en la UI: "Secret names can only contain
          alphanumeric characters or underscores").
        required: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout argos-contracts-scenarios (repo hermano)
        if: inputs.contracts-ref != ''
        uses: actions/checkout@v4
        with:
          repository: argos-ai-xdr/argos-contracts-scenarios
          ref: ${{ inputs.contracts-ref }}
          path: _contracts-scenarios
          # 2026-08-18: argos-contracts-scenarios pasó a público -- ya no
          # requiere CONTRACTS_CHECKOUT_TOKEN para el checkout en sí
          # (repos públicos se clonan con el github.token por defecto).
          # `||` conserva el secreto como override real si el repo
          # volviera a ser privado: un secreto vacío (no configurado)
          # hace que actions/checkout falle con "Input required and not
          # supplied: token" si se le pasa "" explícito -- core.getInput
          # con required:true trata la cadena vacía igual que "no
          # suministrado", así que sin este fallback un secreto ausente
          # rompe el checkout aunque el repo sea público.
          token: ${{ secrets.CONTRACTS_CHECKOUT_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Lint (ruff)
        # _contracts-scenarios/ (si existe -- contracts-ref != '') es un
        # checkout hermano DENTRO del workspace solo para que los tests
        # resuelvan ARGOS_CONTRACTS_PATH -- no es código de este
        # repositorio y no debe lintarse (encontrado 2026-08-18 en un run
        # real: ruff reportaba EXE001 sobre
        # _contracts-scenarios/validators/validate_fixtures.py).
        run: ruff check . --exclude _contracts-scenarios

      - name: Type check (mypy)
        run: mypy . --exclude '^_contracts-scenarios/' || true # elevar a bloqueante cuando el repo declare tipado estricto

      - name: Tests (pytest, con cobertura)
        env:
          ARGOS_CONTRACTS_PATH: ${{ inputs.contracts-ref != '' && format('{0}/_contracts-scenarios', github.workspace) || '' }}
        run: pytest --cov --cov-report=term-missing

      - name: Bloquear secretos filtrados
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --exclude-files '_contracts-scenarios/' > /tmp/secrets-scan.json
          python -c "import json,sys; d=json.load(open('/tmp/secrets-scan.json')); sys.exit(1 if d['results'] else 0)"
