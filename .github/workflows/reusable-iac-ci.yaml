name: reusable-iac-ci

on:
  workflow_call:
    inputs:
      opentofu-directory:
        type: string
        default: "opentofu"
      kustomize-directory:
        type: string
        default: "kustomize"
      helm-directory:
        type: string
        default: "helm"

jobs:
  opentofu:
    runs-on: ubuntu-latest
    if: inputs.opentofu-directory != ''
    defaults:
      run:
        working-directory: ${{ inputs.opentofu-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check -recursive
      - run: |
          for env in environments/*/; do
            (cd "$env" && tofu init -backend=false -input=false && tofu validate)
          done

  kustomize-and-policy:
    runs-on: ubuntu-latest
    if: inputs.kustomize-directory != ''
    steps:
      - uses: actions/checkout@v4

      - name: Instalar kustomize, kubeconform y conftest
        run: |
          # Se instalan en $RUNNER_TEMP, no en la raíz del checkout: algunos
          # repos (p. ej. argos-platform) tienen un directorio de primer
          # nivel llamado "kustomize/" (los manifiestos), que colisiona con
          # el binario "kustomize" que el instalador crea por defecto en cwd.
          tools_dir="$RUNNER_TEMP/iac-tools"
          mkdir -p "$tools_dir"
          (cd "$tools_dir" && curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash)
          (cd "$tools_dir" && curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform)
          # El asset de conftest incluye la versión y usa "Linux" en mayúscula
          # (p. ej. conftest_0.69.0_Linux_x86_64.tar.gz); a diferencia de
          # kustomize/kubeconform no hay un alias "latest" estable con nombre
          # fijo, así que se resuelve la versión vía la API de releases.
          conftest_version=$(curl -sSL https://api.github.com/repos/open-policy-agent/conftest/releases/latest | jq -r .tag_name | sed 's/^v//')
          (cd "$tools_dir" && curl -sSL "https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_${conftest_version}_Linux_x86_64.tar.gz" | tar xz conftest)
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Build + validar cada overlay
        run: |
          for overlay in ${{ inputs.kustomize-directory }}/overlays/*/; do
            # LoadRestrictionsNone: las bases de este repo referencian
            # deliberadamente recursos fuera del árbol kustomize/ (namespaces
            # en kubernetes/, políticas en policies/) para no duplicarlos.
            kustomize build --load-restrictor LoadRestrictionsNone "$overlay" > /tmp/rendered.yaml
            # -ignore-missing-schemas: los CRD de Gatekeeper (ConstraintTemplate,
            # Constraint) no tienen schema OpenAPI publicado que kubeconform
            # pueda resolver; se validan solo los kinds nativos de Kubernetes.
            kubeconform -strict -ignore-missing-schemas -summary /tmp/rendered.yaml
            # policies/gatekeeper contiene ConstraintTemplate (CRD con el Rego
            # incrustado en YAML, para el webhook de admisión en vivo), no
            # políticas .rego sueltas en el formato que conftest sabe cargar
            # (ni el input que espera coincide: Gatekeeper usa
            # input.review.object, conftest pasa el recurso directamente) —
            # comprobar solo el directorio hace que conftest falle con "no
            # policies found" en vez de no tener nada que hacer.
            if compgen -G "policies/gatekeeper/*.rego" > /dev/null; then
              conftest test /tmp/rendered.yaml --policy policies/gatekeeper
            fi
          done

  helm-lint:
    runs-on: ubuntu-latest
    if: inputs.helm-directory != ''
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          for chart in ${{ inputs.helm-directory }}/*/; do
            helm lint "$chart"
          done
