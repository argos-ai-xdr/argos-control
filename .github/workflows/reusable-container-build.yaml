name: reusable-container-build

on:
  workflow_call:
    inputs:
      image-name:
        description: "Nombre corto de la imagen, p. ej. normalizer, correlator"
        type: string
        required: true
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "Dockerfile"
      registry:
        type: string
        required: true
    outputs:
      image-digest:
        description: Digest de la imagen construida (sha256:...)
        value: ${{ jobs.build.outputs.digest }}
    secrets:
      registry-username:
        required: true
      registry-password:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.registry }}/argos/${{ inputs.image-name }}:${{ github.sha }}
          provenance: true
          sbom: false # SBOM se genera y firma en reusable-sbom-sign.yaml a partir del digest emitido aquí

      - name: Publicar digest para consumo por release manifest
        run: echo "${{ inputs.image-name }}@${{ steps.push.outputs.digest }}"
