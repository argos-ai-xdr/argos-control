# Deep Assurance (prompt maestro de arquitectura objetivo, §22 y anexo
# "Deep Assurance"; ADR-051; argos-control/architecture/v0.6.25-gap-matrix.md).
#
# NO existe todavía un "Deep Assurance Architecture" como subsistema de
# software (motor que genere/valide esta cadena automáticamente — eso es
# Fase J, no construida). Esto es el LEDGER real: la cadena
# Requirement→Claim→Argument→Control→Test→Metric→Run→Evidence→
# Residual Risk→Gate, mantenida a mano, sobre el MVP que SÍ existe hoy —
# mismo principio que traceability.yaml (argos-validation) pero para
# afirmaciones de seguridad concretas, no para trazabilidad de historias.
#
# Regla dura (igual que el prompt exige): ningún claim crítico hereda
# SUPPORTED solo porque el componente exista. Cada uno exige
# evidence_refs verificables — archivo/test real, no una afirmación. Los
# claims sobre capacidades que NO existen (Safety Kernel, etc.) se listan
# igual, en NOT_SUPPORTED — el ledger no oculta huecos.

schema_version: 1

states: [SUPPORTED, PARTIALLY_SUPPORTED, NOT_SUPPORTED, NOT_EVALUATED]

claims:
  - id: CLAIM-001
    requirement: "AC10 — ejecuciones sin aprobación = 0"
    statement: >
      Ninguna acción con dry_run=false se ejecuta sin una Approval válida
      (decision=APPROVE, rol soc-approver, no caducada, plan_hash
      coincidente).
    argument: >
      mcp_gateway.Gateway.authorize() solo permite action=execute con
      tool.approval_required si ApprovalStore.validate_and_consume no
      lanza ApprovalRejected — que ocurre para replay, segregación de
      funciones, decisión != APPROVE, TTL expirado o signature_ref
      desajustado del plan_hash actual.
    controls:
      - argos-cyber-tools/mcp_gateway/__init__.py
      - argos-cyber-tools/policies/approval/__init__.py
    tests:
      - argos-cyber-tools/tests/authorization/test_gateway.py
      - argos-cyber-tools/tests/anti-replay/test_approval_anti_replay.py
      - argos-validation/evaluators/approval_gate/__init__.py
    metric: unapproved_execution_rate
    run_evidence: "argos-validation/harness/acceptance.py, AC10=PASS (verificado 2026-08-17)"
    residual_risk: >
      Sin contracts_path disponible, approval_gate cuenta como violación
      (fail-closed) en vez de asumir aprobación — correcto para el
      propósito de este claim, pero significa que el evaluador nunca
      puede reportar falso-PASS por falta de datos.
    state: SUPPORTED
    gate: G5

  - id: CLAIM-002
    requirement: "AC12 — rollback success = 1.00"
    statement: >
      Un ActionResult con status=rolled_back solo cuenta como éxito si
      verification.passed=true, recomputado de forma independiente
      (rollback/verification.py no confía en el propio campo del
      ActionResult).
    argument: >
      rollback_isolation/rollback_scale_to_zero comprueban el estado
      REAL (was_isolated / was_scaled_down) antes de mutar — un rollback
      sin nada que revertir reporta changed_resources=[] en vez de
      afirmar un cambio falso (bug real corregido en esta sesión).
    controls:
      - argos-cyber-tools/rollback/strategies.py
      - argos-cyber-tools/rollback/verification.py
    tests:
      - argos-cyber-tools/tests/rollback/test_rollback_cycle.py
    metric: rollback_success_rate
    run_evidence: "argos-validation/harness/acceptance.py, AC12=PASS (verificado 2026-08-17)"
    residual_risk: >
      Probado solo contra FakeClusterState/FakeReplicaState en memoria —
      nunca contra un cluster real (bloqueado en ENV-QUAL-01). El
      resultado es real para la lógica, no para la infraestructura.
    state: PARTIALLY_SUPPORTED
    gate: G5

  - id: CLAIM-003
    requirement: "AC03/AC08 — CVE/IoC inventados = 0"
    statement: >
      Ningún VulnerabilityFinding con source_ref que no resuelve a un
      snapshot real entra en priorización.
    argument: >
      evaluators.hallucination compara source_ref contra snapshots
      reales; vulnerability_adapter rechaza (no fabrica) un finding sin
      purl/cpe.
    controls:
      - argos-core/services/vulnerability_adapter/__init__.py
      - argos-validation/evaluators/hallucination/__init__.py
    tests:
      - argos-core/tests/unit/test_vulnerability_adapter.py
    metric: ungrounded_cve_rate
    run_evidence: "argos-validation/harness/acceptance.py, AC03/AC08=FAIL contra thresholds/acceptance.yaml (verificado 2026-08-17) — PASS contra thresholds/smoke.yaml"
    residual_risk: >
      El run real de aceptación FALLA hoy porque solo hay fixtures
      smoke-tier, no datos acceptance-tier calibrados — reportado tal
      cual por harness/acceptance.py, no suavizado.
    state: PARTIALLY_SUPPORTED
    gate: G2

  - id: CLAIM-004
    requirement: "AC13 — sin duplicación de efecto ante reintento"
    statement: >
      Un reintento con la misma idempotency_key devuelve el ActionResult
      ya producido, nunca reaplica el efecto.
    argument: >
      IdempotencyStore.get()/remember() se consulta antes de aplicar
      cualquier cambio real en KubernetesExecutor/ScaleToZeroExecutor.
    controls:
      - argos-cyber-tools/executors/__init__.py
    tests:
      - argos-cyber-tools/tests/idempotency/test_executor_idempotency.py
    metric: idempotency_violation_rate
    run_evidence: "argos-validation/harness/acceptance.py, AC13=PASS (verificado 2026-08-17)"
    residual_risk: "Ninguno identificado a nivel de lógica."
    state: SUPPORTED
    gate: G5

  - id: CLAIM-005
    requirement: "El LLM/motor de recomendación nunca tiene credenciales de ejecución ni acceso directo a infraestructura"
    statement: >
      Ningún RecommendationEngine (determinista o LangGraph) importa un
      ejecutor de argos-cyber-tools; toda acción pasa por
      mcp_gateway→OPA→Approval antes de llegar a un executor.
    argument: >
      Verificado por inspección real de imports: cero referencias de
      import (no solo de prosa) desde argos-core/services/recommendation
      hacia executors/mcp_gateway de argos-cyber-tools. El propio
      docstring del módulo lo declara como invariante.
    controls:
      - argos-core/services/recommendation/__init__.py
    tests: []
    metric: null
    run_evidence: "grep de imports reales en services/recommendation/__init__.py, sin resultados hacia executors (verificado 2026-08-17)"
    residual_risk: >
      No hay un test automatizado que FALLE si alguien añade ese import
      en el futuro (solo verificación manual esta sesión) — candidato a
      un check de arquitectura en CI, no construido todavía.
    state: PARTIALLY_SUPPORTED
    gate: G5

  - id: CLAIM-006
    requirement: "Target allowlist — out-of-scope action = 0"
    statement: >
      Ninguna tool con target_allowlist_required=true se autoriza contra
      un target fuera de su allowlist declarada.
    argument: >
      Gateway.authorize() comprueba request.target contra
      target_allowlists ANTES de evaluar Approval — probado contra
      ejemplos reales fuera de scope.
    controls:
      - argos-cyber-tools/mcp_gateway/__init__.py
      - argos-cyber-tools/policies/target-allowlists/
    tests:
      - argos-cyber-tools/tests/authorization/test_gateway.py
      - argos-cyber-tools/tests/graph/test_attack_path.py
    metric: tool_correctness
    run_evidence: "argos-validation/harness/acceptance.py, AC09=PASS (verificado 2026-08-17)"
    residual_risk: >
      La allowlist de NIVEL RANGO (argos-platform/cyber-range/targets/allowlist.yaml,
      distinta de la allowlist por tool) sigue siendo plantilla sin
      rellenar — ver argos-cyber-tools/docs/cyber-range-package.md.
    state: PARTIALLY_SUPPORTED
    gate: G3

  - id: CLAIM-007
    requirement: "ARG-010 — drift crítico omitido = 0"
    statement: >
      Un asset cuya criticidad no se puede confirmar tras comparar
      as-designed/as-built se marca explícitamente, nunca se asume "no
      crítico" por defecto.
    argument: >
      evaluators.drift solo cuenta "missed" cuando criticality_esp es
      irresoluble en alguna de las dos instantáneas — un drift
      confirmado-crítico es el caso correctamente detectado, no un fallo.
    controls:
      - argos-validation/evaluators/drift/__init__.py
    tests:
      - argos-validation/tests/test_evaluators.py
    metric: critical_drift_missed_rate
    run_evidence: "argos-validation/harness/acceptance.py, suite c06 (verificado 2026-08-17)"
    residual_risk: "Ninguno identificado a nivel de lógica."
    state: SUPPORTED
    gate: G2

  - id: CLAIM-008
    requirement: "Reproducibilidad — dos ejecuciones limpias producen el mismo conjunto de hechos (AC01)"
    statement: >
      Correr la misma suite dos veces sobre el mismo checkout de
      fixtures produce valores de métrica idénticos.
    argument: >
      harness/reproducibility.py corre run_suite() dos veces y compara
      value/gate/sample_size métrica por métrica, ignorando solo
      generated_at (metadato de cuándo, no de qué se encontró).
    controls:
      - argos-validation/harness/reproducibility.py
    tests:
      - argos-validation/tests/test_reproducibility.py
      - argos-validation/tests/test_acceptance.py
    metric: reproducibility_violation
    run_evidence: "argos-validation/harness/acceptance.py, AC01=PASS (verificado 2026-08-17)"
    residual_risk: "Ninguno identificado a nivel de lógica."
    state: SUPPORTED
    gate: G1

  - id: CLAIM-009
    requirement: "Safety Kernel valida límites deterministas antes de OPA/Policy"
    statement: >
      Una Recommendation pasa por un módulo determinista y no generativo
      que valida target/tool/runbook/blast-radius/drift antes de
      alcanzar PolicyDecision.
    argument: >
      safety_kernel.evaluate() ejecuta 14 comprobaciones deterministas
      (ADR-054, Fase H) y produce un SafetyEnvelope real cuando
      SAFE_TO_EVALUATE; independent_verifier.verify() (ADR-055) lo
      re-confirma con hechos frescos. Corregido en la reconciliación
      global A→L 2026-08-17: este claim estaba obsoleto desde antes de
      Fase H — declaraba NOT_SUPPORTED cuando el módulo ya existía y
      estaba probado. R0-01 cerrado 2026-08-18 (argos-cyber-tools@0d1316b):
      mcp_gateway.Gateway.authorize() ahora exige, para action=execute,
      un SafetyEnvelope vigente y vinculado a tool/target/acción y un
      VerificationResult=VERIFIED referenciando el mismo envelope_hash
      (_check_safety_chain, fail-closed, antes del chequeo de Approval)
      -- Approval sigue siendo autoridad independiente (§8 R0-01), no
      sustituida. mcp_gateway.controlled_execution.
      execute_with_authorization es el único punto de entrada real que
      conecta authorize() con los tres executors; un test estructural
      (test_no_production_code_calls_executors_directly_outside_the_boundary)
      prueba que ningún otro código de producción los invoca.
    controls:
      - argos-core/services/safety_kernel/__init__.py
      - argos-core/services/independent_verifier/__init__.py
      - argos-cyber-tools/mcp_gateway/__init__.py
      - argos-cyber-tools/mcp_gateway/controlled_execution.py
    tests:
      - argos-core/tests/unit/test_safety_kernel.py
      - argos-core/tests/unit/test_independent_verifier.py
      - argos-core/tests/integration/test_k1_mission_verifier_vertical_slice.py
      - argos-cyber-tools/tests/authorization/test_gateway.py
      - argos-cyber-tools/tests/authorization/test_controlled_execution.py
    metric: safety_envelope_gateway_integration_rate
    run_evidence: "argos-core pytest, 376 tests (verificado 2026-08-17); argos-cyber-tools pytest, 130 tests -- ruff y mypy en verde (verificado 2026-08-18, commit 4d9b4e9); grep de mcp_gateway/__init__.py SÍ encuentra SafetyEnvelope/VerificationResult (antes: cero referencias); grep sistemático en los 7 repos confirma que controlled_execution.py es el único entry point real hacia los executors"
    residual_risk: >
      RESUELTO el hallazgo CRITICAL de conexión (R0-01, ver
      architecture/implementation-readiness.md §13). Dos residuales no
      críticos, ambos documentados con test que prueba el límite exacto
      (no solo afirmado): (1) SAFE_TO_EVALUATE sigue sin ser alcanzable
      con datos reales hoy (runbook_signed/runtime_trust_valid
      estructuralmente None, Sovereign Root of Trust no existe) -- gap de
      fuente de hechos externa, no de conexión entre módulos. (2) R0-01-
      RESIDUAL: la identidad de "plan" verificada es el triple
      (tool, target, action), no una identidad de plan compartida --
      SafetyEnvelope.incident_ref y Approval.action_id (real en el
      contrato v1) no se cruzan entre sí, así que dos SafetyEnvelope de
      incidentes distintos sobre el mismo tool/target/action son
      indistinguibles hoy para el gateway
      (test_known_gap_safety_chain_does_not_bind_incident_identity_across_envelopes).
      No explotable hoy: ningún llamante de producción real construye un
      ToolCallRequest de ejecución todavía (graph.attack_path es el único
      constructor real, y es validación de seguridad, nunca ejecución
      real) -- mapeado a ARG-023 (integración end-to-end), no a un ARG
      nuevo.
    state: PARTIALLY_SUPPORTED
    gate: G5
    next_action: >
      Ninguna funcional hasta que ARG-023 introduzca el primer llamante
      real de ejecución. Para avanzar CLAIM-009 más allá de
      PARTIALLY_SUPPORTED en ese momento hace falta, no solo el binding
      de identidad de plan (R0-01-RESIDUAL): tests de integración y
      adversariales del camino completo con datos reales, las 3 rebanadas
      verticales de acción real (isolate_kubernetes_workload/
      scale_to_zero/increase_monitoring) end-to-end, y su integración con
      EvidenceRoot/TransparencyReceipt (Fase J) -- no basta con "el código
      se ve bien" (decisión del usuario, 2026-08-18).

  - id: CLAIM-011
    requirement: "Un FederatedArtifact remoto nunca concede autoridad de ejecución local"
    statement: >
      ACCEPT/QUARANTINE/REJECT/LOCAL_REVALIDATION_REQUIRED de Federation
      nunca produce, por sí solo, un ActionRequest ejecutable ni una
      Approval.
    argument: >
      FederationDecision.is_active es una propiedad estructural siempre
      False; SafetyCheckInput (safety_kernel) no tiene ningún campo que
      un FederatedArtifact/FederationDecision pueda rellenar (probado
      por introspección de dataclasses.fields).
    controls:
      - argos-core/services/federation/decision.py
      - argos-core/services/safety_kernel/__init__.py
    tests:
      - argos-core/tests/integration/test_federation_safety_vertical_slice.py
      - argos-core/tests/adversarial/test_federation_adversarial.py
    metric: federation_authority_amplification_rate
    run_evidence: "argos-core pytest, 376 tests incl. 24 tests de rebanada vertical de seguridad + adversarial (verificado 2026-08-17)"
    residual_risk: >
      Probado dentro de argos-core únicamente (Safety Kernel/Verifier
      viven ahí). No incluye la ruta completa hasta OPA/HITL
      (argos-cyber-tools/argos-smartops) por el límite real entre
      repos — ver CLAIM-009 para el hueco de integración del gateway.
    state: SUPPORTED
    gate: null

  - id: CLAIM-012
    requirement: "UNKNOWN de misión/verificación nunca se trata como impacto cero ni como VERIFIED"
    statement: >
      Un MissionContext ausente o insuficiente produce
      INSUFFICIENT_CONTEXT, nunca NONE/LOW; un Independent Verifier sin
      hechos frescos suficientes produce INCONCLUSIVE, nunca VERIFIED.
    argument: >
      mission_context._mission_level() retorna INSUFFICIENT_CONTEXT
      explícitamente cuando falta contexto; independent_verifier.verify()
      solo produce VERIFIED cuando ningún check es None ni False
      (fail-closed, mismo criterio que safety_kernel.decide_state).
    controls:
      - argos-core/services/mission_context/__init__.py
      - argos-core/services/independent_verifier/__init__.py
    tests:
      - argos-core/tests/unit/test_mission_context.py
      - argos-core/tests/unit/test_independent_verifier.py
      - argos-core/tests/integration/test_k1_mission_verifier_vertical_slice.py
    metric: unknown_treated_as_safe_rate
    run_evidence: "argos-core pytest, 376 tests (verificado 2026-08-17)"
    residual_risk: "Probado dentro de argos-core; mismo límite de integración de CLAIM-009."
    state: SUPPORTED
    gate: null

  - id: CLAIM-010
    requirement: "Transparency Log — historial de promoción/revocación append-only"
    statement: >
      Toda promoción, revocación o aprobación crítica queda en un log
      append-only con TransparencyReceipt verificable.
    argument: >
      ADR-057 (Fase J): TransparencyLog encadena entry_hash/
      previous_entry_hash real (sha256), detecta mutación histórica y
      huecos de secuencia recomputando desde cero, nunca confiando en el
      campo ya escrito. EvidenceRoot agrega EvidenceManifest reales de
      forma determinista (mismo conjunto -> mismo root_hash) y se
      verifica con la misma disciplina. Probado con las 3 acciones
      execute reales de Fase I, no con datos sintéticos.
    controls:
      - "TransparencyLog.append() es la única vía pública de mutación (sin delete/edit/clear)"
      - "verify_chain() recomputa cada entry_hash y el enlace previous_entry_hash de forma independiente"
      - "build_evidence_root detecta duplicados conflictivos y rechaza evidencia crítica ausente (nunca UNKNOWN)"
    tests:
      - "argos-core/tests/unit/test_transparency_log.py"
      - "argos-core/tests/unit/test_evidence_root.py"
      - "argos-core/tests/unit/test_replay.py"
      - "argos-core/tests/unit/test_evidence_j_invariants.py"
      - "argos-core/tests/integration/test_evidence_vertical_slice.py"
    metric: "chain_verification_pass_rate"
    run_evidence:
      - "376 tests reales en argos-core (commit 0afbbc74146d6b1fa55bc1d486515fedb1a7b9ec, verificado 2026-08-17 en la reconciliación global A→L), incluye vertical slice con las 3 acciones execute reales de Fase I y la integración de evidencia de Fase K/L reutilizando el mismo mecanismo"
    residual_risk: >
      LOGICALLY_APPEND_ONLY / TAMPER_EVIDENT, NO immutable: backend en
      memoria + JSONL opcional, sin object-lock/WORM real (Ceph RGW no
      desplegado, ARG-026) ni firma criptográfica (sin PKI, ARG-002/
      ARG-020) ni servicio de transparencia externo. Cubre
      EVIDENCE_ROOT_CREATED/VERIFIED y ACTION_EXECUTED/VERIFIED/
      ROLLED_BACK -- NO cubre promoción/revocación de componentes de IA
      (ese flujo no existe todavía, ver ai-component-registry.yaml).
      Distinto de AuditLog (argos-smartops), que es real pero sin
      hash-chain y cubre solo acciones del operador.
    state: PARTIALLY_SUPPORTED
    gate: G7

no_waiver_for:
  # Mismo principio que project/acceptance/acceptance-criteria.yaml —
  # ningún claim de esta lista admite waiver.
  - CLAIM-001
  - CLAIM-004
