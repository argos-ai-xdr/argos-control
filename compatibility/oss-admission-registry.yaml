      digest: "PENDIENTE (ENV-QUAL-01)"
      repositorio_interno: "PENDIENTE — mirror/registry interno aún no aprovisionado"
    licencia:
      spdx_id: GPL-2.0-only
      texto_y_notices: "Verificar NOTICE/LICENSE del tag exacto fijado, no del HEAD"
      dependencias_modificadas: "Ninguna modificación local prevista: uso self-hosted sin fork"
      obligaciones_distribucion_red: "GPL-2.0: sin obligación de red (no es AGPL); obligación de código fuente solo si se REDISTRIBUYE el binario modificado — no aplica a uso interno self-hosted"
    supply_chain:
      sbom: "PENDIENTE (ENV-QUAL-01)"
      provenance_attestation: "PENDIENTE (ENV-QUAL-01)"
      firma: "PENDIENTE (ENV-QUAL-01)"
      scanner: "Trivy (ya baseline en compatibility/components.yaml, capability Vulnerability)"
      cves_conocidos: "PENDIENTE — requiere escanear la imagen digest-pinned real"
      excepcion_con_caducidad: null
    operacion_soberana:
      instalacion_offline: "Soportada (agente/servidor/indexer/dashboard self-hosted, sin dependencia SaaS)"
      egress: "Ninguno requerido para operación (feeds CTI van por MISP, no por Wazuh)"
      almacenamiento: "OpenSearch (ya baseline, capability Evidence)"
      backup_restore: "PENDIENTE — sin script real todavía (ver traceability.yaml, gate G6, ARG-025)"
      upgrade_rollback: "PENDIENTE (ENV-QUAL-01)"
    sostenibilidad:
      cadencia: "Activo, releases regulares (proyecto establecido, no side-project)"
      mantenedores: "Wazuh Inc. + comunidad, múltiples mantenedores activos"
      bus_factor: "Bajo riesgo — empresa dedicada al proyecto"
      owner_interno: "PENDIENTE — asignar en Scope Gate G0 (ADR-013)"
      soporte: "Comunidad + soporte comercial opcional (no obligatorio, no se usa)"
      alternativa_adapter: "Elastic Security / Suricata+ELK vía el mismo Normalizer (argos-core/services/normalizer ya abstrae por 'source')"
    gate: ADMIT_WITH_OBLIGATIONS
    gate_reason: >
      Licencia GPL-2.0 sin obligación de red y sin modificación local
      prevista: admisible. ADMIT_WITH_OBLIGATIONS (no ADMIT liso) porque el
      pin de versión/digest/SBOM/CVE sigue pendiente de un release real —
      la obligación es "no promover a producción sin completar esos campos
      primero", no una duda sobre la licencia.

