# OSS-QUAL-01 (propuesta v0.6.25.4, §2.3.1): registro de admisión y
# obligaciones OSS. La condición open source NO elimina obligaciones de
# licencia, procedencia, vulnerabilidades ni soporte — cada fila se congela
# contra la versión y el artefacto REALMENTE promovidos, no contra "la
# última release de GitHub". Complementa (no sustituye) compatibility/
# components.yaml: ese archivo fija el baseline P0 por capability; este
# registra la decisión de admisión OSS con los 6 campos que exige
# OSS-QUAL-01 para cada componente que aparece ahí con licencia copyleft o
# AGPL, donde la obligación de licencia es lo que de verdad hay que
# vigilar.
#
# gate=UNKNOWN no es un valor válido para ninguna fila que entre en la
# release candidate (regla dura del documento). Donde un sub-campo depende
# de un release real desplegado (imagen+digest fijados, SBOM, CVEs
# escaneados) y ese release no existe todavía porque ENV-QUAL-01 (cualificar
# contra un cluster OSC/Gardener real) sigue BLOCKED, el sub-campo se marca
# explícitamente "PENDIENTE (ENV-QUAL-01)" — nunca se rellena con un
# digest/hash inventado. Esto es distinto de gate=UNKNOWN: la decisión de
# ADMITIR el proyecto (licencia, sostenibilidad, alternativa) SÍ es
# evaluable hoy con información pública verificable, aunque el pin de
# versión exacto todavía no lo sea.
#
# Legal/OSS Officer debe validar el texto y las obligaciones REALES del
# release fijado antes de distribuir nada — las licencias de abajo son
# "candidatas de planificación" (columna del documento maestro), no una
# opinión legal vinculante.

